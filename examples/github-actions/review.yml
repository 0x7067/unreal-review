name: Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install unreal-review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          cd "$RUNNER_TEMP/base"
          go install ./cmd/unreal-review
      - name: Review pull request
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UNREAL_HARNESS_LLM_MODEL: ${{ vars.UNREAL_HARNESS_LLM_MODEL }}
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.repository }}#${{ github.event.pull_request.number }}
        run: |
          unreal-review run --pr "$PULL_REQUEST" --out findings.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: unreal-review-findings
          path: findings.jsonl
          retention-days: 7
      - name: Upload review session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unreal-review-session-${{ github.run_id }}-${{ github.run_attempt }}
          path: ~/.local/state/unreal-agent/sessions/
          if-no-files-found: warn

  post:
    needs: review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install unreal-review from base commit
        run: |
          go install ./cmd/unreal-review
      - uses: actions/download-artifact@v8
        with:
          name: unreal-review-findings
          path: ${{ runner.temp }}/findings
      - name: Post review
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.repository }}#${{ github.event.pull_request.number }}
        run: |
          unreal-review render github --pr "$PULL_REQUEST" "$RUNNER_TEMP/findings/findings.jsonl"
