name: Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check out base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Install unreal-review from base commit
        working-directory: ${{ runner.temp }}/base
        run: |
          go install ./cmd/unreal-review
      - name: Review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UNREAL_HARNESS_LLM_MODEL: ${{ vars.UNREAL_HARNESS_LLM_MODEL }}
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.repository }}#${{ github.event.pull_request.number }}
        run: |
          unreal-review run --pr "$PULL_REQUEST" --out findings.jsonl
          unreal-review render github --pr "$PULL_REQUEST" findings.jsonl
