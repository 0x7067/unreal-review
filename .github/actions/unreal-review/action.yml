name: Install unreal-review
description: >-
  Download the unreal-review binary from a 0x7067/unreal-agent GitHub release
  and put it on PATH. The release tag is UNREAL_AGENT_VERSION.

inputs:
  UNREAL_AGENT_VERSION:
    description: >-
      Release tag of https://github.com/0x7067/unreal-agent that ships unreal-review.
    required: false
    # TODO(p2): set to fork release tag
    default: v0.0.0-PLACEHOLDER

runs:
  using: composite
  steps:
    - name: Install unreal-review from the unreal-agent release
      shell: bash
      env:
        UNREAL_AGENT_VERSION: ${{ inputs.UNREAL_AGENT_VERSION }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
