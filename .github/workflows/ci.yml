name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Install Bend 2.0.27
        env:
          BEND_NO_TELEMETRY: "1"
        run: |
          url=https://github.com/bendlang/bend/releases/download/v2.0.27/bend-2.0.27-linux-x64.tar.gz
          echo "58adc86af6605ed0c48f7d84e4c23028f78893ce4a867a20a4f004b11582687b  bend.tar.gz" > bend.sha256
          curl -fsSL "$url" -o bend.tar.gz
          sha256sum -c bend.sha256
          tar -xzf bend.tar.gz
          test -x "$PWD/bend/bin/bend"
          echo "$PWD/bend/bin" >> "$GITHUB_PATH"
      - run: make check build
        env:
          BEND_NO_TELEMETRY: "1"
