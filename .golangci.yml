version: "2"

linters:
  enable:
    - bodyclose
    - depguard
    - errorlint
    - misspell
    - noctx
  settings:
    depguard:
      rules:
        findings:
          files:
            - "**/findings/**"
          allow:
            - $gostd
        review:
          files:
            - "**/review/**"
          allow:
            - $gostd
            - github.com/0x7067/unreal-review/findings

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/0x7067/unreal-review
